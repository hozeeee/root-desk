name: RootDesk CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Electron smoke on macOS
        if: runner.os == 'macOS'
        run: npm run smoke
      - name: Package unsigned macOS build
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac
      - name: Package Windows build
        if: runner.os == 'Windows'
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: rootdesk-${{ runner.os }}
          path: release/

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$package_version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: rootdesk-*
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "RootDesk $GITHUB_REF_NAME"
